# nginx reverse proxy for ERDDAP + Push API (production).
#
# ERDDAP_HOST = 127.0.0.1 if nginx runs on the ERDDAP server, otherwise the ERDDAP
# server's private IP (then set ERDDAP_BIND_ADDRESS to that IP in .env and firewall
# ports 8080/8000 so only nginx can reach them). nginx must reach ERDDAP from a
# private address (10/8, 172.16/12, 192.168/16): ERDDAP's Tomcat only trusts
# X-Forwarded-Proto from those, and logins need it.
#
# Ports must match ERDDAP_HTTP_PORT / PUSH_API_PORT in .env.

server {
    listen 443 ssl http2;
    server_name erddap.spc.int;

    # ssl_certificate     /etc/ssl/certs/erddap.spc.int.crt;
    # ssl_certificate_key /etc/ssl/private/erddap.spc.int.key;

    # ERDDAP
    location /erddap/ {
        proxy_pass http://ERDDAP_HOST:8080;          # no trailing slash/path
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;    # required for ERDDAP logins
        proxy_read_timeout 600s;                     # large data requests
        proxy_buffering off;                         # stream big downloads
    }

    # Push API
    location /api/ {
        proxy_pass http://ERDDAP_HOST:8000;          # no trailing slash/path
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 500m;                   # = PUSH_MAX_UPLOAD_MB
        proxy_read_timeout 600s;
    }

    location = / { return 302 /erddap/; }
}

server {
    listen 80;
    server_name erddap.spc.int;
    return 301 https://$host$request_uri;
}
